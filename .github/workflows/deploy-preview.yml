name: Deploy Preview

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # 05:00 JST. GitHub Actions cron uses UTC.
    - cron: '0 20 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: itsrun-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: itsrunnew
    env:
      AWS_REGION: ap-northeast-1
      PREVIEW_ROLE_ARN: arn:aws:iam::470447451992:role/itsrun-track-preview-deploy
      PREVIEW_BUCKET: itsrunpreviewstack-sitebucket397a1860-khjbgxk7mmdb
      PREVIEW_DISTRIBUTION_ID: E2F8WYHWRDA3NS
      PREVIEW_DOMAIN: d2xryux7a95b54.cloudfront.net
      PREVIEW_URL: https://d2xryux7a95b54.cloudfront.net
      VITE_FIELD_REPORTS_API: ${{ vars.ITSRUN_PREVIEW_FIELD_REPORTS_API }}
      VITE_DEPLOY_TARGET: preview
      VITE_ADSENSE_ENABLED: 'false'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect source-check-date-only push
        id: facility_date
        env:
          ITSRUN_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/facility-date-only.mjs
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: itsrunnew/package-lock.json
      - name: Install PDF rendering tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Install locked dependencies
        run: npm ci
      - name: Install field report API test dependencies
        run: npm run reports:install
      - name: Restore AI reading cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: itsrunnew/.cache/availability-ai
          key: availability-ai-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            availability-ai-v1-${{ runner.os }}-
      - name: Generate fresh availability range
        id: availability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ITSRUN_REQUIRE_AI_KEY: 'true'
        run: npm run collect:availability:range
      - name: Verify availability freshness and completeness
        run: npm run validate:availability:fresh
      - name: Validate track expansion batches
        run: npm run validate:track-batches
      - name: Validate Track Dataset
        run: npm run validate:tracks
      - name: Run unit tests
        run: npm test
      - name: Run lint and type checks
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Run local production smoke
        id: local_smoke
        run: npm run test:smoke:preview
      - name: Configure GitHub OIDC credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ env.PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: itsrun-preview-${{ github.run_id }}
      - name: Deploy changed content and invalidate changed URLs
        id: deploy_content
        env:
          ITSRUN_DEFER_FACILITY_DATE_INVALIDATION: ${{ steps.facility_date.outputs.date_only }}
        run: npm run deploy:preview:content
      - name: Verify published page and Service Worker bytes
        id: published_bytes
        env:
          ITSRUN_BASE_URL: ${{ env.PREVIEW_URL }}
        run: node scripts/verify-deployed-content.mjs
      - name: Verify CloudFront Preview
        id: cloudfront_smoke
        env:
          ITSRUN_BASE_URL: ${{ env.PREVIEW_URL }}
        run: npm run test:smoke
      - name: Write deployment summary
        if: always() && steps.checkout.outcome == 'success'
        env:
          DEPLOY_ENVIRONMENT: Preview
          DEPLOY_TRIGGER: ${{ github.event_name }}
          DEPLOYED_COMMIT: ${{ github.sha }}
          AVAILABILITY_RESULT: ${{ steps.availability.outcome }}
          LOCAL_SMOKE_RESULT: ${{ steps.local_smoke.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy_content.outcome }}
          INVALIDATION_ID: ${{ steps.deploy_content.outputs.invalidation_id }}
          INVALIDATION_PATHS: ${{ steps.deploy_content.outputs.invalidation_paths }}
          CHANGED_FILES: ${{ steps.deploy_content.outputs.changed_files }}
          REMOVED_FILES: ${{ steps.deploy_content.outputs.removed_files }}
          CLOUDFRONT_SMOKE_RESULT: ${{ steps.cloudfront_smoke.outcome }}
          PUBLISHED_BYTES_RESULT: ${{ steps.published_bytes.outcome }}
          DEPLOY_URL: ${{ env.PREVIEW_URL }}
        run: npm run deployment:summary
