name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # 05:30 and 08:15 JST; the second run picks up same-day Setagaya notices.
    - cron: '30 20 * * *'
    - cron: '15 23 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: itsrun-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    name: Build and deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: itsrunnew
    env:
      AWS_REGION: ap-northeast-1
      PRODUCTION_ROLE_ARN: ${{ vars.ITSRUN_PRODUCTION_ROLE_ARN }}
      PRODUCTION_BUCKET: ${{ vars.ITSRUN_PRODUCTION_BUCKET }}
      PRODUCTION_DISTRIBUTION_ID: ${{ vars.ITSRUN_PRODUCTION_DISTRIBUTION_ID }}
      PRODUCTION_DOMAIN: ${{ vars.ITSRUN_PRODUCTION_DOMAIN }}
      PRODUCTION_URL: ${{ vars.ITSRUN_PRODUCTION_URL }}
      VITE_FIELD_REPORTS_API: ${{ vars.ITSRUN_PRODUCTION_FIELD_REPORTS_API }}
      VITE_DEPLOY_TARGET: production
      VITE_ADSENSE_ENABLED: 'true'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: itsrunnew/package-lock.json
      - name: Install PDF rendering tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Install locked dependencies
        run: npm ci
      - name: Install field report API test dependencies
        run: npm run reports:install
      - name: Restore AI reading cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: itsrunnew/.cache/availability-ai
          key: availability-ai-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            availability-ai-v1-${{ runner.os }}-
      - name: Generate fresh availability range
        id: availability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ITSRUN_REQUIRE_AI_KEY: 'true'
        run: npm run collect:availability:range
      - name: Verify availability freshness and completeness
        run: npm run validate:availability:fresh
      - name: Validate track expansion batches
        run: npm run validate:track-batches
      - name: Validate Track Dataset
        run: npm run validate:tracks
      - name: Run unit tests
        run: npm test
      - name: Run lint and type checks
        run: npm run lint
      - name: Build static site with advertising and Google CMP
        run: npm run build
      - name: Run local production smoke
        id: local_smoke
        run: npm run test:smoke:preview
      - name: Configure GitHub OIDC credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ env.PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: itsrun-production-${{ github.run_id }}
      - name: Deploy changed content and invalidate changed URLs
        id: deploy_content
        run: npm run deploy:production:content
      - name: Verify published page and Service Worker bytes
        id: published_bytes
        env:
          ITSRUN_BASE_URL: ${{ env.PRODUCTION_URL }}
          ITSRUN_EXPECT_EDGE_ROUTING: 'true'
        run: node scripts/verify-deployed-content.mjs
      - name: Verify Production CloudFront
        id: cloudfront_smoke
        env:
          ITSRUN_BASE_URL: ${{ env.PRODUCTION_URL }}
          ITSRUN_EXPECT_EDGE_ROUTING: 'true'
        run: npm run test:smoke
      - name: Write deployment summary
        if: always() && steps.checkout.outcome == 'success'
        env:
          DEPLOY_ENVIRONMENT: Production
          DEPLOY_TRIGGER: ${{ github.event_name }}
          DEPLOYED_COMMIT: ${{ github.sha }}
          AVAILABILITY_RESULT: ${{ steps.availability.outcome }}
          LOCAL_SMOKE_RESULT: ${{ steps.local_smoke.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy_content.outcome }}
          INVALIDATION_ID: ${{ steps.deploy_content.outputs.invalidation_id }}
          INVALIDATION_PATHS: ${{ steps.deploy_content.outputs.invalidation_paths }}
          CHANGED_FILES: ${{ steps.deploy_content.outputs.changed_files }}
          REMOVED_FILES: ${{ steps.deploy_content.outputs.removed_files }}
          CLOUDFRONT_SMOKE_RESULT: ${{ steps.cloudfront_smoke.outcome }}
          PUBLISHED_BYTES_RESULT: ${{ steps.published_bytes.outcome }}
          DEPLOY_URL: ${{ env.PRODUCTION_URL }}
        run: npm run deployment:summary
