name: Deploy Production

on:
  workflow_run:
    workflows: [Node validation]
    types: [completed]
    branches: [master]
  repository_dispatch:
    types: [availability-refresh]
  workflow_dispatch:
    inputs:
      app_validation_run:
        description: Optional successful master validation run to restore its exact app artifact (7-day retention)
        type: string
        required: false
      data_generation:
        description: Optional fresh availability generation to restore (same JST day, within 6 hours)
        type: string
        required: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  PRODUCTION_ROLE_ARN: ${{ vars.ITSRUN_PRODUCTION_ROLE_ARN }}
  PRODUCTION_BUCKET: ${{ vars.ITSRUN_PRODUCTION_BUCKET }}
  PRODUCTION_DISTRIBUTION_ID: ${{ vars.ITSRUN_PRODUCTION_DISTRIBUTION_ID }}
  PRODUCTION_DOMAIN: ${{ vars.ITSRUN_PRODUCTION_DOMAIN }}
  PRODUCTION_URL: ${{ vars.ITSRUN_PRODUCTION_URL }}
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    if: github.ref == 'refs/heads/master' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.release.outputs.app }}
      data: ${{ steps.release.outputs.data }}
      sha: ${{ steps.release.outputs.sha }}
      run: ${{ steps.release.outputs.run }}
      rollback: ${{ steps.release.outputs.rollback }}
      generation: ${{ steps.release.outputs.generation }}
    steps:
      - name: Check out protected master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Select a validated release or a data refresh
        id: release
        working-directory: itsrunnew
        env:
          ROLLBACK_RUN_ID: ${{ inputs.app_validation_run }}
          ROLLBACK_GENERATION: ${{ inputs.data_generation }}
        run: node scripts/production-release.mjs prepare

  refresh:
    needs: plan
    if: needs.plan.outputs.data == 'true'
    concurrency:
      group: itsrun-production-data
      cancel-in-progress: false
    name: Publish availability without rebuilding the app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: itsrunnew
    env:
      ITSRUN_DEPLOY_SCOPE: data
      ITSRUN_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - name: Check out validated collector revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: itsrunnew/package-lock.json
      - name: Install locked collector dependencies
        run: npm ci
      - name: Install PDF rendering tools
        if: needs.plan.outputs.generation == ''
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Restore AI reading cache
        if: needs.plan.outputs.generation == ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: itsrunnew/.cache/availability-ai
          key: availability-ai-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            availability-ai-v1-${{ runner.os }}-
      - name: Generate fresh availability range
        if: needs.plan.outputs.generation == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ITSRUN_REQUIRE_AI_KEY: 'true'
        run: npm run collect:availability:range
      - name: Restore an existing fresh generation
        if: needs.plan.outputs.generation != ''
        env:
          ROLLBACK_GENERATION: ${{ needs.plan.outputs.generation }}
        run: node scripts/availability/restore-publication.mjs
      - name: Refresh weekly running course status
        run: npm run collect:courses
      - name: Validate freshness and every publication partition
        run: npm run validate:availability:fresh
      - name: Prepare only the owned data prefix
        run: |
          mkdir -p dist
          cp -R src/data/availability dist/availability
      - name: Configure GitHub OIDC credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ env.PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Reject an obsolete collector revision
        run: node scripts/production-release.mjs guard "$ITSRUN_SOURCE_SHA" data
      - name: Publish only availability
        id: publish
        run: npm run deploy:production:content
      - name: Verify published data bytes
        id: verify
        env:
          ITSRUN_BASE_URL: ${{ env.PRODUCTION_URL }}
          ITSRUN_EXPECT_EDGE_ROUTING: 'true'
        run: node scripts/verify-deployed-content.mjs
      - name: Record data publication outcome
        if: always()
        env:
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: node scripts/publication-summary.mjs

  app:
    needs: [plan, refresh]
    if: always() && needs.plan.outputs.app == 'true' && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    concurrency:
      group: itsrun-production-app
      cancel-in-progress: false
    name: Publish the validated application artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: itsrunnew
    env:
      ITSRUN_DEPLOY_SCOPE: app
      ITSRUN_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      VALIDATION_RUN_ID: ${{ needs.plan.outputs.run }}
      IS_ROLLBACK: ${{ needs.plan.outputs.rollback }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out protected release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: itsrunnew/package-lock.json
      - name: Install release-check dependencies
        run: npm ci
      - name: Verify and restore exact artifact bytes and compatible facility IDs
        run: node scripts/production-release.mjs restore "$VALIDATION_RUN_ID" "$ITSRUN_SOURCE_SHA"
      - name: Reject an obsolete automatic release
        if: env.IS_ROLLBACK != 'true'
        run: node scripts/production-release.mjs guard "$ITSRUN_SOURCE_SHA" app
      - name: Configure GitHub OIDC credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ env.PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish only application files
        id: publish
        run: npm run deploy:production:content
      - name: Verify published application bytes
        env:
          ITSRUN_BASE_URL: ${{ env.PRODUCTION_URL }}
          ITSRUN_EXPECT_EDGE_ROUTING: 'true'
        run: node scripts/verify-deployed-content.mjs
      - name: Verify release routing, assets and browser startup
        id: verify
        env:
          ITSRUN_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:release
      - name: Record application publication outcome
        if: always()
        env:
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: node scripts/publication-summary.mjs
