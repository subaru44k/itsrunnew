name: Node validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: node-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: itsrunnew
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: itsrunnew/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate track expansion batches
        run: npm run validate:track-batches
      - name: Validate Track Dataset
        run: npm run validate:tracks
      - name: Run unit tests
        run: npm test
      - name: Run lint and type checks
        run: npm run lint
      - name: Build static site
        run: npm run build
