name: Node validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: node-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: itsrunnew
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check changed files and whitespace
        id: change_scope
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --check "$BASE_SHA" HEAD
          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          if [[ -z "$changed_files" ]]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              *.md) ;;
              *) echo 'docs_only=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done <<< "$changed_files"
          echo 'docs_only=true' >> "$GITHUB_OUTPUT"
      - name: Set up Node 24
        if: steps.change_scope.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: itsrunnew/package-lock.json
      - name: Install PDF rendering tools
        if: steps.change_scope.outputs.docs_only != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Install locked dependencies
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm ci
      - name: Install field report API dependencies
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run reports:install
      - name: Validate track expansion batches
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run validate:track-batches
      - name: Validate Track Dataset
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run validate:tracks
      - name: Run unit tests
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm test
      - name: Verify monitoring email without sending
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run test:monitor:email
      - name: Verify facility reverification without external API calls
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run test:reverification
      - name: Run lint and type checks
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run lint
      - name: Build static site
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run build
      - name: Verify daily regression scenarios
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run test:daily:fixtures
      - name: Verify live daily availability pipeline without deployment
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run test:daily

  diagnose_sources:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/availability-actions-connectivity'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Compare Node and curl source connectivity
        run: |
          node --input-type=module <<'JS'
          import { lookup } from 'node:dns/promises';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          const urls = ['https://tokyo-south-seaside-parks.com/sports-athletics/', 'https://kouen-kyougijyou.kosi-kanri.com/', 'https://kamiyugi-park.jp/facility/athletics-stadium/', 'https://www.nozuta-park.com/calender.html', 'https://vonds.net/access/', 'https://kawasaki-todoroki-park.co.jp/guide/track-and-field/', 'https://www.expo70-park.jp/sports/facility/arena/'];
          console.log('Node', process.version);
          await Promise.all(urls.map(async url => {
            const host = new URL(url).hostname;
            try { console.log('DNS', host, await lookup(host, { all: true })); } catch (e) { console.log('DNS_ERROR', host, e.code); }
            try { const r = await fetch(url, { signal: AbortSignal.timeout(15000) }); await r.arrayBuffer(); console.log('NODE_OK', host, r.status); }
            catch (e) { console.log('NODE_ERROR', host, JSON.stringify({ name: e.name, code: e.cause?.code, nested: e.cause?.errors?.map(x => ({code: x.code, address: x.address})) })); }
            try { const r = await exec('curl', ['-sS', '--max-time', '15', '-o', '/dev/null', '-w', '%{http_code}', url]); console.log('CURL_OK', host, r.stdout); }
            catch (e) { console.log('CURL_ERROR', host, e.code, e.stderr); }
          }));
          JS
