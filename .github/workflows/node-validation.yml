name: Node validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: node-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: itsrunnew
    env:
      CHROME_PATH: /usr/bin/google-chrome
      VITE_DEPLOY_TARGET: production
      VITE_ADSENSE_ENABLED: 'true'
      VITE_FIELD_REPORTS_API: ${{ vars.ITSRUN_PRODUCTION_FIELD_REPORTS_API }}
      ITSRUN_PREBUILT_DIST: ${{ github.workspace }}/itsrunnew/dist
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check changed files and whitespace
        id: change_scope
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node itsrunnew/scripts/validation-scope.mjs
      - name: Set up Node 24
        if: steps.change_scope.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: itsrunnew/package-lock.json
      - name: Install PDF rendering tools
        if: steps.change_scope.outputs.docs_only != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Install locked dependencies
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm ci
      - name: Install field report API dependencies
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run reports:install
      - name: Validate track expansion batches
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run validate:track-batches
      - name: Validate Track Dataset
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run validate:tracks
      - name: Run unit tests
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm test
      - name: Verify monitoring email without sending
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run test:monitor:email
      - name: Verify facility reverification without external API calls
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run test:reverification
      - name: Build the production application once
        if: steps.change_scope.outputs.docs_only != 'true'
        run: npm run build
      - name: Verify affected browser features with fresh fixtures
        if: steps.change_scope.outputs.docs_only != 'true'
        env:
          ITSRUN_TEST_SUITES: ${{ steps.change_scope.outputs.suites }}
        run: npm run test:features
      - name: Verify daily regression scenarios
        if: steps.change_scope.outputs.daily == 'true'
        run: npm run test:daily:fixtures
      - name: Verify live daily availability pipeline without deployment
        if: steps.change_scope.outputs.daily == 'true'
        run: npm run test:daily
      - name: Seal the validated master publication artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DEPLOY_APP: ${{ steps.change_scope.outputs.deploy_app }}
          DEPLOY_DATA: ${{ steps.change_scope.outputs.deploy_data }}
        run: node scripts/release-artifact.mjs seal
      - name: Save the validated publication artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release-${{ github.sha }}
          path: itsrunnew/.cache/release
          if-no-files-found: error
          retention-days: 7
