name: Migration validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - migration/aws-s3-cloudfront

permissions:
  contents: read

concurrency:
  group: migration-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 24.18.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Pin npm 11.4.2
        run: |
          npm install --global npm@11.4.2
          test "$(npm --version)" = "11.4.2"
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Run production-browser checks
        run: npm run test:e2e
